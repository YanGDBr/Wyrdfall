[project]
name = "wyrdfall"
version = "0.1.0"
description = "Wyrdfall - a buildcraft roguelike RPG for the terminal"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "networkx>=3.2",
    "websockets>=12.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
wyrdfall = "wyrdfall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyrdfall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
